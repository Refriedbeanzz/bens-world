<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ben's World — Battle Simulator</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a2210; }
      #hud {
        position: fixed; top: 10px; left: 12px; z-index: 10;
        font-family: Georgia, 'Times New Roman', serif; color: #e8e0c8;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8); user-select: none; pointer-events: none;
      }
      #hud h1 { font-size: 18px; margin: 0 0 2px 0; letter-spacing: 1px; }
      #hud p { font-size: 12px; margin: 0; opacity: 0.75; }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>BEN'S WORLD</h1>
      <p>WASD / arrows / right-drag to pan &middot; mouse wheel to zoom</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
